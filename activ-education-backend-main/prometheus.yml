global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'postgresql'
    static_configs:
      - targets: ['host.docker.internal:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['host.docker.internal:6379']
