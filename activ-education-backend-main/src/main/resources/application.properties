spring.application.name=activEducation

# Charge .env automatiquement (DotenvEnvironmentPostProcessor via META-INF/spring.factories)
springdotenv.filename=.env
springdotenv.ignore-if-missing=true

# PostgreSQL (dev local)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:activ_education}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Bean Validation (JPA/Hibernate)
spring.jpa.properties.jakarta.persistence.validation.mode=auto
spring.jpa.properties.hibernate.validator.fail_fast=true

# Server
server.port=${SERVER_PORT:8080}

# Logs
logging.level.root=INFO
logging.level.tg.edtch.activEducation=DEBUG

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false
springdoc.packages-to-scan=tg.edtch.activEducation
springdoc.paths-to-match=/**
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# MinIO
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket.images=${MINIO_BUCKET_IMAGES:activeducation-images}
minio.bucket.videos=${MINIO_BUCKET_VIDEOS:activeducation-videos}
minio.bucket.documents=${MINIO_BUCKET_DOCUMENTS:activeducation-documents}

# Configuration Multipart (Upload de fichiers jusqu'à 500MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# OpenAI
openai.api.key=${OPENAI_API_KEY:}
openai.api.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.api.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}

# Thymeleaf
spring.thymeleaf.check-template-location=false

# Sécurité (JWT)
security.jwt.secret=${JWT_SECRET}
# 15 min (par défaut)
security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# 7 jours (par défaut)
security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
security.jwt.issuer=activ-education

# Redis (Rate Limiting & Token Blacklist)
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Rate Limiting
rate.limit.login.max=${RATE_LIMIT_LOGIN_MAX:20}
rate.limit.login.window-minutes=${RATE_LIMIT_LOGIN_WINDOW:15}
rate.limit.refresh.max=${RATE_LIMIT_REFRESH_MAX:20}
rate.limit.refresh.window-minutes=${RATE_LIMIT_REFRESH_WINDOW:5}
rate.limit.api.max=${RATE_LIMIT_API_MAX:200}
rate.limit.api.window-minutes=${RATE_LIMIT_API_WINDOW:1}
