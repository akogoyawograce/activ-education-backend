name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'activ-education-fronted-main/activ_education/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'activ-education-fronted-main/activ_education/**'

defaults:
  run:
    working-directory: activ-education-fronted-main/activ_education

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
