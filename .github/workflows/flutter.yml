name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'activ-education-fronted-main/activ_education/**'
  pull_request:
    branches: [main]
    paths:
      - 'activ-education-fronted-main/activ_education/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activ-education-fronted-main/activ_education

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
