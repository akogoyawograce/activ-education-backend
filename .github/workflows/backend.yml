name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'activ-education-backend-main/**'
  pull_request:
    branches: [main]
    paths:
      - 'activ-education-backend-main/**'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: activ_education
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: activ-education-backend-main

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean install -DskipTests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: activ_education
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: dev-jwt-secret-for-ci-build-only

      - name: Run tests
        run: ./mvnw test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: activ_education
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: dev-jwt-secret-for-ci-build-only
